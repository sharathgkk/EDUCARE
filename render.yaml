services:
  - type: web
    name: educare-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: educare-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: EDUCARE_DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXCONN_APP_KEY
        sync: false
      - key: NEXCONN_APP_SECRET
        sync: false
      - key: NEXCONN_AREA_CODE
        value: SG
